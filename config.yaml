# ----------------------------------------------------- JDM importer sites ---
# US JDM engine importers. Each entry lists one or more search URLs to try
# (WordPress `?s=` and Shopify `/search?q=` styles); the generic parser pulls
# any product links whose text matches the 2L-T patterns. Sites that error or
# change layout show up in the digest's source-health table.
jdm_sites:
  - name: JDM Engine Depot (NJ)
    urls:
      - https://jdmenginedepot.com/?s=2LT
      - https://jdmenginedepot.com/?s=2L-T
      - https://jdmenginedepot.com/?s=toyota+diesel
