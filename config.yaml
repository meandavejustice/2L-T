# ------------------------------------------------- forum classifieds --------
# New-thread RSS from the big Toyota forums — the main private-party venue.
# Threads run through the same 2L-family relevance filter as everything else.
forums:
  - name: ih8mud forum
    urls:
      - https://forum.ih8mud.com/forums/-/index.rss
  # (Expedition Portal's feed 403s CI; its classifieds are covered by the
  # web-discovery site query instead.)
  - name: Pirate4x4 forum
    urls:
      - https://www.pirate4x4.com/forums/-/index.rss
      - https://www.pirate4x4.com/forums/external.php?type=RSS2
  - name: YotaTech forum
    urls:
      - https://www.yotatech.com/forums/external.php?type=RSS2
      - https://www.yotatech.com/forums/-/index.rss
  # (Marlin Crawler's forum exposes no working RSS; the site is covered by
  # the web-discovery sweep instead.)

# ------------------------------------------- Canadian classifieds -----------
# Flagged as imports in the digest (freight south is cheap).
canada_sites:
  - name: 🇨🇦 Kijiji
    urls:
      - https://www.kijiji.ca/b-canada/toyota-2lt/k0l0
      - https://www.kijiji.ca/b-canada/toyota-diesel-engine/k0l0

# ------------------------------------- Japan exporters (ship to USA) --------
# The deepest 2L-T supply is Japan-side. Listings land in the digest's
# separate "Imports — ships to USA" section. Buyee fronts Yahoo Auctions JP;
# queries are URL-encoded Japanese ("2LT エンジン" etc.) since engine codes
# stay Latin in Japanese titles.
japan_exporters:
  # Buyee's search bot-blocks CI, so we search Yahoo Auctions JP directly and
  # the scanner rewrites result links into Buyee purchase links (same IDs).
  - name: 🇯🇵 Yahoo Auctions JP (Buyee links)
    urls:
      - https://auctions.yahoo.co.jp/search/search?p=2LT%20%E3%82%A8%E3%83%B3%E3%82%B8%E3%83%B3&n=50
      - https://auctions.yahoo.co.jp/search/search?p=2L-T%20%E3%82%A8%E3%83%B3%E3%82%B8%E3%83%B3&n=50
      - https://auctions.yahoo.co.jp/search/search?p=2LTE%20%E3%82%A8%E3%83%B3%E3%82%B8%E3%83%B3&n=50
  # Yahoo Shopping (fixed-price stores; separate from the Auctions pool).
  - name: 🇯🇵 Yahoo Shopping JP
    urls:
      - https://shopping.yahoo.co.jp/search?p=2LT+%E3%82%A8%E3%83%B3%E3%82%B8%E3%83%B3
      - https://shopping.yahoo.co.jp/search?p=2L-T+%E3%82%A8%E3%83%B3%E3%82%B8%E3%83%B3
  - name: 🇯🇵 Mercari JP
    urls:
      - https://jp.mercari.com/search?keyword=2LT%20%E3%82%A8%E3%83%B3%E3%82%B8%E3%83%B3
      - https://jp.mercari.com/search?keyword=2L-T%20%E3%82%A8%E3%83%B3%E3%82%B8%E3%83%B3
  - name: 🇯🇵 BE FORWARD Auto Parts
    urls:
      - https://autoparts.beforward.jp/search?keyword=2LT
      - https://autoparts.beforward.jp/search?keyword=2L-T+engine
  - name: 🇯🇵 Croooober (Up Garage)
    urls:
      - https://www.croooober.com/en/search?keyword=2LT+engine
      - https://www.croooober.com/search?keyword=2LT

# ------------------------------------------------------- web discovery ------
# Sweeps the wider web daily — forums (ih8mud, Marlin Crawler), small
# importers, classifieds we don't scrape directly. Keyless via DuckDuckGo by
# default; set a BRAVE_API_KEY secret to use the Brave Search API instead
# (free tier, more robust). Google CSE is closed to new customers and is not
# supported.
discovery:
  queries:
    - toyota 2LT engine for sale
    - toyota 2L-T turbo diesel engine for sale
    - toyota 2LTE engine for sale
    - hilux 2LT engine transmission for sale
    - toyota 2LT engine site:forum.ih8mud.com
    - toyota diesel engine for sale site:expeditionportal.com
