# Toyota 2L-T engine scanner configuration
#
# Target: Toyota 2L-T (2.4L turbo diesel, MECHANICAL injection pump).
# NOT the 2L-TE (electronic injection) — but sellers frequently mislabel
# mechanical 2L-Ts as "2LTE", so listings mentioning 2L-TE are still
# collected and flagged for manual verification instead of discarded.

recipient: david@justice.engineering

# Full uncapped listings board, written to docs/index.html each run and
# served by GitHub Pages (one-time enable: Settings → Pages → Deploy from a
# branch → this branch, /docs folder). Email truncation lines link here.
board_url: https://davejustice.com/2L-T/

# ---------------------------------------------------------------- eBay ------
# Scraped by default. For 100% reliability register a free eBay developer
# account and set EBAY_CLIENT_ID / EBAY_CLIENT_SECRET secrets (see README);
# the scanner automatically switches to the official Browse API when present.
ebay:
  queries:
    - toyota 2lt engine
    - toyota 2l-t engine
    - toyota 2lte engine
    - toyota 2l-te engine
    - toyota 2l turbo diesel engine
    - hilux turbo diesel engine 2.4
    - toyota 2.4 turbo diesel engine
    - toyota 2l diesel engine
    - toyota 3l diesel engine
    - toyota 5l diesel engine
    - toyota l series diesel engine

