name: Daily 2L-T Scan

on:
  schedule:
    # Full daily digest: 11:00 UTC = 7am EDT (6am EST in winter)
    - cron: "0 11 * * *"
    # Alert-only scans (email only when a NEW engine-tier listing appears):
    # 17:00 & 23:00 UTC = 1pm & 7pm EDT
    - cron: "0 17,23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # SMTP credentials live in this deployment environment's secrets.
    environment: MAIN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Classifier regression tests
        run: python tests/test_classify.py

      - name: Run scan
        # Each falls back to a repository *variable* of the same name in case
        # the value was added under the Variables tab instead of Secrets.
        env:
          # False only on the alert-cron firings: email goes out only when a
          # new engine-tier listing appeared.
          FULL_DIGEST: ${{ github.event.schedule != '0 17,23 * * *' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || vars.SMTP_PASSWORD }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM || vars.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO || vars.DIGEST_TO }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID || vars.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET || vars.EBAY_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || vars.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID || vars.GOOGLE_CSE_ID }}
        run: python -m scanner.main

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: digest.html
          if-no-files-found: ignore

      - name: Commit seen-listings state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_listings.json docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen listings [skip ci]"
            # The branch may have moved while the scan ran; rebase (keeping
            # our fresh state file on conflict) and retry.
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            done
          fi
