name: Ad-hoc Scan
# TEMPORARY utility: runs only when the pushed commit message contains
# 'adhoc-scan'. Prints results to the log; no email, no state, no board.

on:
  push:
    branches:
      - claude/toyota-2lt-engine-scanner-2rlr6t

permissions:
  contents: read

jobs:
  adhoc:
    if: contains(github.event.head_commit.message, 'adhoc-scan')
    runs-on: ubuntu-latest
    environment: MAIN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run ad-hoc scan
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID || vars.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET || vars.EBAY_CLIENT_SECRET }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY || vars.BRAVE_API_KEY }}
        run: python -m scripts.adhoc_scan
